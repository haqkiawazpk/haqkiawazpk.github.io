name: Backup index to haq-ki-awaz-before-0415-25nov2026.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy index.html to backup file
        run: |
          cp index.html haq-ki-awaz-before-0415-25nov2026.html
          cmp index.html haq-ki-awaz-before-0415-25nov2026.html
          wc -c index.html haq-ki-awaz-before-0415-25nov2026.html
          ls -l haq-ki-awaz-before-0415-25nov2026.html
      - name: Commit backup
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add haq-ki-awaz-before-0415-25nov2026.html
          git status --short
          git commit -m "Backup index.html to haq-ki-awaz-before-0415-25nov2026.html before 04:15 update" || echo "No changes to commit"
          git push
