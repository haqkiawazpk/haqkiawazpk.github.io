name: Temp backup current index followfix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Back up current index.html
        run: |
          set -euo pipefail
          test -f index.html
          cp index.html haq-ki-awaz-before-followfix-8nov2026.html
          ls -l index.html haq-ki-awaz-before-followfix-8nov2026.html
          sha256sum index.html haq-ki-awaz-before-followfix-8nov2026.html
      - name: Commit backup file
        run: |
          set -euo pipefail
          git config user.name 'haqkiawazpk'
          git config user.email 'haqkiawazpk@users.noreply.github.com'
          git add haq-ki-awaz-before-followfix-8nov2026.html
          git status --short
          git commit -m 'Back up index.html before follow fix 8 Nov 2026' || echo 'nothing to commit'
          git push
