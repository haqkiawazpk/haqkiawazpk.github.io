name: Sync haq temp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch haq file from project repo
        run: |
          curl -L https://raw.githubusercontent.com/haqkiawazpk/haq-ki-awaz/main/haq-ki-awaz.html -o haq-ki-awaz.html
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "Sync haq-ki-awaz.html and index.html from project repo"
          git push
