name: Backup index before 1325 update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save a copy of the current index.html
        run: cp index.html haq-ki-awaz-before-1325-7nov2026.html
      - name: Commit the backup copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add haq-ki-awaz-before-1325-7nov2026.html
          git commit -m "Preserve current live index.html before 13:25 7 Nov 2026 update" || echo "No changes to commit"
          git push
