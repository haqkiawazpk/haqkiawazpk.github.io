name: Temp backup index 2243
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Back up index.html
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          cp index.html haq-ki-awaz-before-2243-23nov2026.html
          test -s haq-ki-awaz-before-2243-23nov2026.html
          git add haq-ki-awaz-before-2243-23nov2026.html
          git diff --cached --quiet || git commit -m "Back up index.html before 2243 update 23 Nov 2026"
          git push
