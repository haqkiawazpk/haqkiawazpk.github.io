name: Backup index before 1615 update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Back up current index.html
        run: |
          set -e
          ls -l index.html
          sha256sum index.html
          cp index.html haq-ki-awaz-before-1615-7nov2026.html
          ls -l haq-ki-awaz-before-1615-7nov2026.html
          sha256sum haq-ki-awaz-before-1615-7nov2026.html
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haq-ki-awaz-before-1615-7nov2026.html
          git commit -m "Back up index.html before 1615 update" || echo "No changes to commit"
          git push
