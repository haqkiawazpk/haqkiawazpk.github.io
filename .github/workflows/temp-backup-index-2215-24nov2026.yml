name: Backup index 2215 24 Nov 2026
on:
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy index.html to backup file
        run: cp index.html haq-ki-awaz-before-2215-24nov2026.html
      - name: Commit backup
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add haq-ki-awaz-before-2215-24nov2026.html
          git commit -m "Backup index.html before 2215 update 24 Nov 2026" || echo "No changes to commit"
          git push
