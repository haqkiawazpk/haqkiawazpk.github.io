name: Update index 2315 24 Nov 2026
on:
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy haq-ki-awaz.html to index.html
        run: cp haq-ki-awaz.html index.html
      - name: Commit index.html
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add index.html
          git commit -m "Haq Ki Awaz update 23:15 24 Nov 2026 — 2 new cards, fuel Rs318/Rs353" || echo "No changes to commit"
          git push
