name: Temp cleanup old backups 0315 25nov2026

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete older backups
        run: |
          ls haq-ki-awaz-before-*.html | grep -v 'haq-ki-awaz-before-0315-25nov2026.html' | xargs -r git rm
          git status --short
      - name: Commit cleanup
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Delete older backup files, keep haq-ki-awaz-before-0315-25nov2026.html"
          git push
