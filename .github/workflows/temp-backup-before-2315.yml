name: Temp backup index before 2315
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current index.html to dated backup
        run: |
          set -e
          cp index.html haq-ki-awaz-before-2315-7nov2026.html
          ls -l index.html haq-ki-awaz-before-2315-7nov2026.html
          sha256sum index.html haq-ki-awaz-before-2315-7nov2026.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add haq-ki-awaz-before-2315-7nov2026.html
          git commit -m "Preserve current live index.html before 23:15 7 Nov 2026"
          git push
