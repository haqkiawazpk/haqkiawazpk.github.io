name: Backup index 1815
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy index.html to backup
        run: |
          cp index.html haq-ki-awaz-before-1815-9nov2026.html
          ls -l haq-ki-awaz-before-1815-9nov2026.html
      - name: Commit backup
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add haq-ki-awaz-before-1815-9nov2026.html
          git commit -m "Backup index.html to haq-ki-awaz-before-1815-9nov2026.html" || echo "nothing to commit"
          git push
