name: Temp backup index 2215
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp index.html haq-ki-awaz-before-2215-25nov2026.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz-before-2215-25nov2026.html
          git commit -m "Backup index.html before 2215 update 25 Nov 2026"
          git push
