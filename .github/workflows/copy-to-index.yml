name: Copy haq-ki-awaz.html to index.html

on:
  workflow_dispatch:
  push:
    paths:
      - haq-ki-awaz.html

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to index.html
        run: |
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace index.html with haq-ki-awaz.html [skip ci]"
          git push
