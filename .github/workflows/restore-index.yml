name: Restore index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html from history
        run: |
          git show b045476:haq-ki-awaz.html > index.html
          ls -lh index.html
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add index.html
          git commit -m "Restore full Haq Ki Awaz site as index.html"
          git push
