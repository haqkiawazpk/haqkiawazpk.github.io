name: Copy haq-ki-awaz to index
on:
  push:
    branches: [main]
    paths:
      - haq-ki-awaz.html
      - .github/workflows/copy-haq-to-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file
        run: |
          cp haq-ki-awaz.html index.html
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Replace index.html with haq-ki-awaz.html"
          git push
