name: Copy haq-ki-awaz to index (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy haq-ki-awaz.html to index.html
        run: cp haq-ki-awaz.html index.html
      - name: Commit index.html if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html"
          else
            git commit -m "Update index.html from haq-ki-awaz.html"
            git push
          fi
