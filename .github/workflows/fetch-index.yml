name: Fetch index from project repo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://raw.githubusercontent.com/haqkiawazpk/haq-ki-awaz/main/haq-ki-awaz.html -o index.html
          test $(stat -c%s index.html) -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          grep -q 'adiala-medical-checkup-imran-bushra-nov2026' index.html || { echo "missing adiala anchor, aborting"; exit 1; }
          grep -q 'trump-iran-strikes-unlikely-nov2026' index.html || { echo "missing trump anchor, aborting"; exit 1; }
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update index.html from haq-ki-awaz project repo - 9 Nov 2026"
          git push
