name: Temp archive 2315 27nov2026
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive haq file to dated copy
        run: |
          cp haq-ki-awaz.html haq-ki-awaz-2026-11-27-2315.html
          ls -l haq-ki-awaz.html haq-ki-awaz-2026-11-27-2315.html
      - name: Commit dated copy
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add haq-ki-awaz-2026-11-27-2315.html
          git commit -m "Archive haq-ki-awaz 2315 27 Nov 2026" || echo "nothing to commit"
          git push
