name: Backup live index before 2115 update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp index.html haq-ki-awaz-before-2115-7nov2026.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz-before-2115-7nov2026.html
          git diff --cached --quiet || git commit -m "Backup index.html before 2115 update - 7 Nov 2026"
          git push
