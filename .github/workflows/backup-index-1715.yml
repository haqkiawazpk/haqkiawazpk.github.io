name: Backup live index before 1715 update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy current index.html to backup
        run: |
          cp index.html "haq-ki-awaz-before-1715-7nov2026.html"
          ls -lh index.html "haq-ki-awaz-before-1715-7nov2026.html"
          sha256sum index.html "haq-ki-awaz-before-1715-7nov2026.html"
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "haq-ki-awaz-before-1715-7nov2026.html"
          git commit -m "Preserve current live index.html before 1715 7 Nov 2026 update"
          git push
