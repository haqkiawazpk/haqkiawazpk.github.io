name: Backup index.html before update (1232)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy index.html to backup
        run: cp index.html haq-ki-awaz-before-1232-19nov2026.html
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haq-ki-awaz-before-1232-19nov2026.html
          git commit -m "Backup index.html before update (1232)" || echo "No changes to commit"
          git push
