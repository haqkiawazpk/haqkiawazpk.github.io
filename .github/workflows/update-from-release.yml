name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-17-1330/haq-ki-awaz.html -o haq-ki-awaz.html
          test "$(stat -c%s haq-ki-awaz.html)" -eq 26312422 || { echo "size mismatch, aborting"; exit 1; }
          echo "43de7fb43f62f6f32f9f6da930e24539498ab242a54b177e57d68b8fbb04a699  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'sc-bail-placenta-trade-case-nov2026' haq-ki-awaz.html || { echo "missing sc-bail anchor, aborting"; exit 1; }
          grep -q 'optimizely-websites-subverted-crypto-theft-nov2026' haq-ki-awaz.html || { echo "missing optimizely anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "site-update-2026-11-17-1330"
          git push
