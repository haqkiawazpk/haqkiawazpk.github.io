name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-13-0820/haq-ki-awaz.html -o haq-ki-awaz.html
          test "$(stat -c%s haq-ki-awaz.html)" -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          echo "199b3bd4a0a228063907692c1297bb03890e54b4622a7e0c6b33b2ca18132c39  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'cec-accuses-govt-sabotage-islamabad-lg-polls-nov2026' haq-ki-awaz.html || { echo "missing cec anchor, aborting"; exit 1; }
          grep -q 'iran-guards-target-us-radar-bahrain-nov2026' haq-ki-awaz.html || { echo "missing iran anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "Update index.html from site-update-2026-11-13-0820 release"
          git push
