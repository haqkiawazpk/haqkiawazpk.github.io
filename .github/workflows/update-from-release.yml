name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-13-1930/haq-ki-awaz.html -o haq-ki-awaz.html
          test "$(stat -c%s haq-ki-awaz.html)" -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          echo "c7f9b888abd3fd892e41f1f0ca80d0d7ba800ebbcbfb783820986fb1c46ac277  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'shc-orangi-amenity-plot-kmc-nov2026' haq-ki-awaz.html || { echo "missing shc anchor, aborting"; exit 1; }
          grep -q 'who-gaza-respiratory-illnesses-winter-nov2026' haq-ki-awaz.html || { echo "missing who anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "site-update-2026-11-13-1930"
          git push
