name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-13/haq-ki-awaz.html -o haq-ki-awaz.html
          test $(stat -c%s haq-ki-awaz.html) -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          echo "797ccecd497582b7704f52b835f6a0349a2ba13ec60c14c4ea73235772d6bce3  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'imran-ideology-message-jail-nov2026' haq-ki-awaz.html || { echo "missing imran anchor, aborting"; exit 1; }
          grep -q 'saudi-eu-pressure-label-houthis-terrorists-nov2026' haq-ki-awaz.html || { echo "missing saudi anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "Update index.html from site-update-2026-11-13 release"
          git push
