name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-13-0322/haq-ki-awaz.html -o haq-ki-awaz.html
          test $(stat -c%s haq-ki-awaz.html) -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          echo "8b12ab4858ca86614ac5fcee6614e71aee3061fae77251eb3357bfdc4c388aa7  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'naqvi-imran-legal-rights-no-change-nov2026' haq-ki-awaz.html || { echo "missing naqvi anchor, aborting"; exit 1; }
          grep -q 'washington-dc-active-shooter-vida-nov2026' haq-ki-awaz.html || { echo "missing washington anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "Update index.html from site-update-2026-11-13-0322 release"
          git push
