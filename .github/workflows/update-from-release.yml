name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-13-1515/haq-ki-awaz.html -o haq-ki-awaz.html
          test "$(stat -c%s haq-ki-awaz.html)" -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          echo "c71be5f54675319d05f2d7f3e33f5fdf45784fa74742ccd851166c1bc46ab7a0  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'pakistan-unsc-houthi-attacks-saudi-nov2026' haq-ki-awaz.html || { echo "missing pakistan unsc anchor, aborting"; exit 1; }
          grep -q 'indonesia-new-vp-dec2-gibran-nov2026' haq-ki-awaz.html || { echo "missing indonesia vp anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "Update index.html from site-update-2026-11-13-1515 release"
          git push
