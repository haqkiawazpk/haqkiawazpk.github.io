name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-17-1230/haq-ki-awaz.html -o haq-ki-awaz.html
          test "$(stat -c%s haq-ki-awaz.html)" -eq 26247810 || { echo "size mismatch, aborting"; exit 1; }
          echo "e828bb3767ef0aae495bf957fc5b5f6170b78f5e6859186527e0fde5e2b8b8a8  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'fake-medicines-mobile-verification-nov2026' haq-ki-awaz.html || { echo "missing fake-medicines anchor, aborting"; exit 1; }
          grep -q 'ukraine-strikes-crimea-bridge-second-day-nov2026' haq-ki-awaz.html || { echo "missing ukraine anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "site-update-2026-11-17-1230"
          git push
