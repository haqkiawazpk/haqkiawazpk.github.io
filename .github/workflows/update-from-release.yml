name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-17-2230/haq-ki-awaz.html -o haq-ki-awaz.html
          test "$(stat -c%s haq-ki-awaz.html)" -eq 27237995 || { echo "size mismatch, aborting"; exit 1; }
          echo "479ff19626dfaacc69678d37d7946bf52cf85ab07dcb11aff1c9f02e2303d687  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'munir-meets-uk-turkish-chiefs-defence-nov2026' haq-ki-awaz.html || { echo "missing munir-meets-uk-turkish-chiefs-defence-nov2026 anchor, aborting"; exit 1; }
          grep -q 'europe-hoax-bomb-threats-investigation-nov2026' haq-ki-awaz.html || { echo "missing europe-hoax-bomb-threats-investigation-nov2026 anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "site-update-2026-11-17-2230"
          git push
