name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-13-2230/haq-ki-awaz.html -o haq-ki-awaz.html
          test "$(stat -c%s haq-ki-awaz.html)" -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          echo "3a83b4a3159a11c9847b58fad79d24bcba4ec0320ff37e3f56554326a174a394  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'president-house-zardari-naqvi-provinces-nov2026' haq-ki-awaz.html || { echo "missing president-house anchor, aborting"; exit 1; }
          grep -q 'bessent-blames-commerce-nvidia-scandal-nov2026' haq-ki-awaz.html || { echo "missing bessent anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "site-update-2026-11-13-2230"
          git push
