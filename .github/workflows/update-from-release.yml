name: Update index from release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fL https://github.com/haqkiawazpk/haqkiawazpk.github.io/releases/download/site-update-2026-11-13-0220/haq-ki-awaz.html -o haq-ki-awaz.html
          test $(stat -c%s haq-ki-awaz.html) -gt 1000000 || { echo "download too small, aborting"; exit 1; }
          echo "de641073fafe8af077299050da0cf7a2736d1a90a5e51d80b705dd3afb8d32a3  haq-ki-awaz.html" | sha256sum -c -
          grep -q 'pm-shehbaz-cop31-leaders-real-action-nov2026' haq-ki-awaz.html || { echo "missing cop31 anchor, aborting"; exit 1; }
          grep -q 'nvidia-huang-steps-down-ceo-nov2026' haq-ki-awaz.html || { echo "missing nvidia anchor, aborting"; exit 1; }
          cp haq-ki-awaz.html index.html
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add haq-ki-awaz.html index.html
          git diff --cached --quiet || git commit -m "Update index.html from site-update-2026-11-13-0220 release"
          git push
