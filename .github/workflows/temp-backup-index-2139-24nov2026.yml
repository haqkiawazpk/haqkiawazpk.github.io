name: Backup index before update
on:
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Back up index.html
        run: cp index.html haq-ki-awaz-before-2139-24nov2026.html
      - name: Commit backup
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add haq-ki-awaz-before-2139-24nov2026.html
          git diff --cached --quiet || git commit -m "Backup index.html before 2139 update"
          git push
