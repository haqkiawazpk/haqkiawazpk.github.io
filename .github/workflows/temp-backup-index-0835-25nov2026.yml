name: Backup index 0835
on:
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy index to backup
        run: cp index.html haq-ki-awaz-before-0835-25nov2026.html
      - name: Commit backup
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add haq-ki-awaz-before-0835-25nov2026.html
          git diff --cached --quiet || git commit -m "Backup index.html before 0835 update 25 Nov 2026"
          git push
