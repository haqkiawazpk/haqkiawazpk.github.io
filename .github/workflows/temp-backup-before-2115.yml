name: Backup index before 1720 deploy
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy index.html to backup file
        run: |
          set -e
          cp index.html haq-ki-awaz-before-1720-9nov2026.html
          test -s haq-ki-awaz-before-1720-9nov2026.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haq-ki-awaz-before-1720-9nov2026.html
          git commit -m "Backup index.html before 1720 deploy - 9 Nov 2026" || echo "No changes to commit"
          git push
