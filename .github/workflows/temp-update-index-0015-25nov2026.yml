name: Temp update index 0015 25nov2026
on:
  workflow_dispatch:
jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy haq file to index
        run: cp haq-ki-awaz.html index.html
      - name: Commit index
        run: |
          git config user.name "haqkiawazpk"
          git config user.email "haqkiawazpk@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Haq Ki Awaz update 00:15 25 Nov 2026 — 2 new cards, 1088 total"
          git push
